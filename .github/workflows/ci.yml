name: Backend checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: aether_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aether" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://aether:ci_password@localhost:5432/aether_test
      JWT_SECRET_KEY: ci-only-not-for-production-change-this-key-123456
      GOOGLE_API_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
