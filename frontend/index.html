<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AETHER AI Gateway</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#e8eaf6;background:#0b1020}*{box-sizing:border-box}body{margin:0}.app{display:flex;min-height:100vh}aside{width:260px;background:#121a30;padding:22px;border-right:1px solid #29334d;display:flex;flex-direction:column;gap:14px}main{flex:1;display:flex;flex-direction:column;min-width:0}h1{font-size:19px;margin:0}h2{font-size:14px;color:#aab4d2}.brand{color:#8ca8ff}.top{padding:18px 26px;border-bottom:1px solid #29334d;display:flex;gap:14px;align-items:center;justify-content:space-between}.chat{flex:1;overflow:auto;padding:25px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 168px)}.bubble{padding:15px 18px;border-radius:16px;max-width:850px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;background:#1b2742}.mine{align-self:flex-end;background:#284577}.meta{font-size:12px;color:#9eacc9;margin-top:8px}.composer{padding:16px 26px;display:flex;gap:10px;border-top:1px solid #29334d}textarea{flex:1;resize:vertical;min-height:48px;max-height:150px;background:#1b2742;color:white;border:1px solid #394969;border-radius:10px;padding:12px}button,select{background:#253453;color:white;border:1px solid #3c5078;border-radius:9px;padding:11px;cursor:pointer}button:hover{background:#385283}.primary{background:#506de2}.session{display:flex;gap:5px;align-items:center}.session button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.session button{padding:8px}.status{font-size:12px;color:#aab4d2}.error{color:#ffb3b3}.empty{text-align:center;margin:auto;color:#aab4d2}@media(max-width:700px){aside{width:125px;padding:9px}.top,.composer{padding:10px}.chat{padding:10px}h1{font-size:14px}.session button{font-size:11px}}
</style></head><body><div class="app"><aside><h1><span class="brand">AETHER</span> AI</h1><button class="primary" id="new">+ New chat</button><h2>Conversations</h2><div id="sessions"></div><div class="status" id="status">Checking providers…</div></aside><main><div class="top"><strong>Intelligent AI Gateway</strong><label>Provider <select id="provider"><option value="auto">Auto routing</option><option value="gemini">Gemini</option><option value="openai">OpenAI</option><option value="anthropic">Anthropic</option><option value="groq">Groq</option></select></label></div><div class="chat" id="chat"></div><form class="composer" id="form"><textarea id="prompt" placeholder="Ask anything…" required></textarea><button class="primary" id="send">Send</button></form></main></div><script>
const API='http://localhost:8000';const el=id=>document.getElementById(id);let sessions=[],active=null,busy=false;
try{sessions=JSON.parse(localStorage.getItem('aether-sessions')||'[]')}catch{}
function save(){localStorage.setItem('aether-sessions',JSON.stringify(sessions))}
function create(){const s={id:crypto.randomUUID(),title:'New conversation',messages:[]};sessions.unshift(s);active=s.id;save();render()}
function current(){return sessions.find(s=>s.id===active)}
function render(){el('sessions').replaceChildren();for(const s of sessions){const row=document.createElement('div');row.className='session';const open=document.createElement('button');open.textContent=s.title;open.onclick=()=>{active=s.id;render()};const rename=document.createElement('button');rename.textContent='✎';rename.title='Rename';rename.onclick=()=>{const n=prompt('Conversation name',s.title);if(n?.trim()){s.title=n.trim();save();render()}};const del=document.createElement('button');del.textContent='×';del.title='Delete';del.onclick=()=>{if(!confirm('Delete conversation?'))return;sessions=sessions.filter(x=>x.id!==s.id);if(active===s.id)active=sessions[0]?.id||null;if(!active)create();else{save();render()}};row.append(open,rename,del);el('sessions').append(row)}el('chat').replaceChildren();const s=current();if(!s)return;for(const m of s.messages){const b=document.createElement('div');b.className='bubble'+(m.role==='user'?' mine':'');b.textContent=m.content;if(m.meta){const meta=document.createElement('div');meta.className='meta';meta.textContent=m.meta;b.append(meta)}el('chat').append(b)}if(!s.messages.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Ask AETHER anything. Your conversation stays in this browser.';el('chat').append(empty)}el('chat').scrollTop=el('chat').scrollHeight}
el('new').onclick=create;if(!sessions.length)create();else{active=sessions[0].id;render()}
async function providers(){try{const r=await fetch(API+'/providers/status');if(!r.ok)throw Error('offline');const data=await r.json();el('status').textContent=Object.entries(data).map(([k,v])=>k+': '+(v.configured?'ready':'no key')).join(' · ')}catch{el('status').textContent='Backend offline'}}providers();
el('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const text=el('prompt').value.trim();if(!text)return;busy=true;el('send').disabled=true;const s=current();const history=s.messages.filter(x=>!x.failed).map(({role,content})=>({role,content}));s.messages.push({role:'user',content:text});if(s.title==='New conversation')s.title=text.slice(0,35);el('prompt').value='';save();render();const pending={role:'assistant',content:'Thinking…'};s.messages.push(pending);render();try{const r=await fetch(API+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,provider:el('provider').value,history})});const data=await r.json();if(!r.ok)throw Error(data.detail?.message||'Request failed');pending.content=data.reply;pending.meta=[data.notice,data.model,data.category,`${data.latency_ms} ms`,data.tokens?.total!=null?`${data.tokens.total} tokens`:'tokens unavailable',data.fallback?'fallback':''].filter(Boolean).join(' · ')}catch(err){pending.content='Request failed: '+err.message;pending.failed=true}finally{busy=false;el('send').disabled=false;save();render();providers()}};
el('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el('form').requestSubmit()}})
</script></body></html>
